# Optional local Neo4j for the pipeline and app. The password is taken from your environment:
#   export NEO4J_PASSWORD=<choose one>   then   docker compose up -d
services:
  neo4j:
    image: neo4j:5
    container_name: neo4j-kb
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD before starting Neo4j}
